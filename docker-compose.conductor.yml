services:
  firestore:
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators
    command:
      - gcloud
      - beta
      - emulators
      - firestore
      - start
      - --host-port=0.0.0.0:8085
      - --project=dice-10000-local
    ports:
      - "${FIRESTORE_EMULATOR_PORT:-8085}:8085"

  app:
    build:
      context: .
      args:
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
        VITE_ADMIN_AUTH_BYPASS: ${VITE_ADMIN_AUTH_BYPASS:-true}
    depends_on:
      - firestore
    environment:
      PORT: 8080
      GCP_PROJECT: dice-10000-local
      FIRESTORE_EMULATOR_HOST: firestore:8085
      ADMIN_AUTH_BYPASS: ${ADMIN_AUTH_BYPASS:-true}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
    ports:
      - "${APP_PORT:-8080}:8080"
